<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080705" />
    <meta name="description" content="Build your business empire in a non-violent 3D San Diego." />
    <title>SUM GREATNESS: Build Your Empire</title>
  </head>
  <body>
    <div id="app">
      <canvas id="world" aria-label="3D San Diego game world"></canvas>
      <header class="topbar glass">
        <div class="brand"><span class="crown">♛</span><div><strong>SUM GREATNESS</strong><small>BUILD YOUR EMPIRE</small></div></div>
        <div class="wallet"><span>💵 <b id="cash">2,500</b></span><span>💎 <b id="gems">25</b></span><span>⚡ <b id="energy">100</b></span></div>
      </header>
      <section class="location glass"><small>SAN DIEGO, CA</small><strong id="district">Gaslamp Quarter</strong><div class="xp"><i id="xp-fill"></i></div><span id="level">LEVEL 1 · ROOKIE</span></section>
      <aside id="mission-card" class="mission glass"><small>ACTIVE MISSION</small><strong>Make Your First Move</strong><p>Meet Maya near the gold marker and learn how to validate a business idea.</p><div><span>Reward: $750 + 100 XP</span><button data-action="focus-mission">TRACK</button></div></aside>
      <div id="toast" role="status"></div>
      <section id="panel" class="panel glass" aria-live="polite"></section>
      <nav class="nav glass" aria-label="Game menu">
        <button data-panel="empire"><span>🏙️</span>Empire</button><button data-panel="missions"><span>🎯</span>Missions</button><button class="play active" data-panel="world"><span>♛</span>PLAY</button><button data-panel="learn"><span>🎓</span>Learn</button><button data-panel="profile"><span>👤</span>Profile</button>
      </nav>
      <div class="controls"><div id="joystick"><i></i></div><div class="action-stack"><button data-action="interact">TALK</button><button data-action="mode" id="mode-btn">DRIVE</button></div></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
